apiVersion: v1
kind: ConfigMap
metadata:
  name: haproxy-config
data:
  haproxy.cfg: |
    global
        daemon
        maxconn 256

    defaults
        mode http
        timeout connect 5000ms
        timeout client 50000ms
        timeout server 50000ms

    frontend http
        bind *:80
        default_backend servers

    backend servers
        balance roundrobin
        server server1 server-first:80 check
        server server2 server-second:80 check

apiVersion: apps/v1
kind: Deployment
metadata:
  name: server-second
  labels:
    app: server-second
spec:
  replicas: 2
  selector:
    matchLabels:
      app: server-second
  template:
    metadata:
      labels:
        app: server-second
    spec:
      containers:
        - name: server
          image: gustafiko/myproject:v1.0
          env:
            - name: ENVIRONMENT
              value: "second"
            - name: TZ
              value: "UTC"
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10

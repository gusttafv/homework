{{- if .Values.service.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-okapp
spec:
  selector:
    app: {{ .Release.Name }}-okapp
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      {{- if eq .Values.service.type "NodePort" }}
      nodePort: {{ .Values.service.nodePort }}
      {{- else if and (ne .Values.service.type "NodePort") (ne .Values.service.type "ClusterIP") }}
      {{- fail (printf "Недопустимый тип сервиса") }}
      {{- end }}
  type: {{ .Values.service.type }}
{{- end }}
